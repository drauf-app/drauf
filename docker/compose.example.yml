# Example Compose setup. Run TLS termination with the reverse proxy of your
# choice; this stack only maps a plain port.
#
# Without DATABASE_URL the server stores its data in an SQLite file under /data.
# To use PostgreSQL instead, uncomment the db service and DATABASE_URL below.
services:
  drauf:
    image: ghcr.io/drauf-app/drauf:latest
    # To build from a checkout instead:
    # build:
    #   context: ..
    #   dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      LOG_LEVEL: "info"
      # Required. Generate with: openssl rand -base64 32
      AUTH_SECRET: "change-me-change-me-change-me-change-me"
      # Set to "false" for OIDC-only installs.
      # AUTH_LOCAL_ENABLED: "true"
      # Sign-in via any OIDC provider (authorization code + PKCE):
      # PUBLIC_URL: "https://drauf.example"
      # OIDC_ISSUER: "https://id.example"
      # OIDC_CLIENT_ID: "drauf"
      # OIDC_CLIENT_SECRET: "only-for-confidential-clients"
      # OIDC_ADMIN_GROUP: "drauf-admin"   # members of this IdP group become admins
      # Turn off individual recipe providers (comma-separated ids):
      # IMPORT_DISABLED_PROVIDERS: "cookidoo"
      # Optional LLM category guessing for unknown items — off by default.
      # Enabling it sends item names to the configured provider (or keeps
      # them on-site with a locally hosted OpenAI-compatible model):
      # CATEGORIZE_LLM: "anthropic"            # or "openai"
      # ANTHROPIC_API_KEY: "sk-ant-..."         # for CATEGORIZE_LLM=anthropic
      # CATEGORIZE_MODEL: "claude-haiku-5-5"    # default: claude-opus-5-5
      # CATEGORIZE_BASE_URL: "http://ollama:11434/v1"  # for CATEGORIZE_LLM=openai
      # CATEGORIZE_API_KEY: ""                  # openai endpoints; empty for local models
      # DATABASE_URL: "postgres://drauf:change-me@db:5432/drauf"
    ports:
      - "3000:3000"
    volumes:
      - drauf-data:/data

  # db:
  #   image: postgres:18-alpine
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_DB: drauf
  #     POSTGRES_USER: drauf
  #     POSTGRES_PASSWORD: change-me
  #   volumes:
  #     - drauf-db:/var/lib/postgresql/data

volumes:
  drauf-data:
  # drauf-db:
