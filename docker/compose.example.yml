# Example Compose setup. Run TLS termination with the reverse proxy of your choice.
#
# Without DATABASE_URL the server stores its data in an SQLite file under /data.
# To use PostgreSQL instead, uncomment the db service and DATABASE_URL below.
services:
  drauf:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      LOG_LEVEL: "info"
      # Required. Generate with: openssl rand -base64 32
      AUTH_SECRET: "change-me-change-me-change-me-change-me"
      # Set to "false" for OIDC-only installs (OIDC support is upcoming).
      # AUTH_LOCAL_ENABLED: "true"
      # DATABASE_URL: "postgres://drauf:change-me@db:5432/drauf"
    ports:
      - "3000:3000"
    volumes:
      - drauf-data:/data

  # db:
  #   image: postgres:18-alpine
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_DB: drauf
  #     POSTGRES_USER: drauf
  #     POSTGRES_PASSWORD: change-me
  #   volumes:
  #     - drauf-db:/var/lib/postgresql/data

volumes:
  drauf-data:
  # drauf-db:
